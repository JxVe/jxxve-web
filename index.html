<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jxxve</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23050505' stroke='%23ffffff' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Pantalla de entrada (LÓGICA Y ANIMACIÓN INTACTAS) ===== -->
<div id="pantalla-inicio">
  <button id="boton-entrar" aria-label="Entrar">
    <span class="anillo"></span>
    <span class="anillo anillo2"></span>
    <span class="punto"></span>
  </button>
  <div class="esquina-texto" id="texto-avanzar"></div>
</div>

<div id="contenido" class="oculto">

  <main class="dashboard">

    <!-- ===================== COLUMNA IZQUIERDA ===================== -->
    <div class="columna col-izquierda">

      <!-- PERFIL / HEADER -->
      <section class="panel panel-header">
        <div class="fila-perfil">
          <div class="avatar-wrap">
            <span class="orbita orbita1"></span>
            <span class="orbita orbita2"></span>
            <div class="avatar-glow">
              <img src="assets/avatar.jpg" alt="Avatar" class="avatar-img">
            </div>
          </div>

          <div class="perfil-info">
            <h1 class="nombre-linea">
              <span id="nombre-usuario"></span>
              <span class="badge-nombre" aria-hidden="true">✓</span>
            </h1>

            <p class="descripcion" id="descripcion"></p>
            <p class="ubicacion" id="ubicacion">📍 <span id="texto-ubicacion"></span></p>

            <p class="frase-corta" id="frase-corta"></p>
          </div>
        </div>

        <div class="stats-fila">
          <div class="stat">
            <span class="stat-icono">👁</span>
            <span class="stat-valor" id="contador-vistas">0</span>
            <span class="stat-label">Vistas</span>
          </div>
          <div class="stat">
            <span class="stat-icono">👨‍💻</span>
            <span class="stat-valor" id="stat-proyectos">0</span>
            <span class="stat-label">Proyectos</span>
          </div>
          <div class="stat">
            <span class="stat-icono">🌌</span>
            <span class="stat-valor" id="stat-logros">0</span>
            <span class="stat-label">Edad</span>
          </div>
          <div class="stat">
            <span class="stat-icono">📅</span>
            <span class="stat-valor" id="stat-desde">0</span>
            <span class="stat-label">Desde</span>
          </div>
        </div>
      </section>

      <!-- PROYECTOS DESTACADOS -->
      <section class="panel">
        <p class="panel-titulo">PROYECTOS DESTACADOS <span class="deco">///</span></p>
        <div class="proyectos-grid" id="proyectos-contenedor"></div>
      </section>

      <!-- REPRODUCTOR DE MÚSICA -->
      <section class="panel reproductor" id="panel-musica">
        <img src="assets/actividad.jpg" alt="" class="reproductor-portada" id="reproductor-portada">

        <div class="reproductor-cuerpo">
          <div class="reproductor-fila-superior">
            <p class="reproductor-titulo" id="reproductor-titulo">sin música</p>
            <p class="reproductor-artista" id="reproductor-artista"></p>
          </div>

          <div class="barra-tiempos">
            <span id="tiempo-actual">0:00</span>
            <div class="barra-fondo"><div class="barra-progreso" id="barra-progreso"></div></div>
            <span id="tiempo-total">0:00</span>
          </div>
        </div>

        <div class="controles-reproductor">
          <button class="control-secundario" id="boton-anterior" aria-label="Anterior">⏮</button>
          <button id="boton-play-pause" class="boton-play" aria-label="Reproducir/Pausar">❚❚</button>
          <button class="control-secundario" id="boton-siguiente" aria-label="Siguiente">⏭</button>
        </div>

        <div class="mini-onda" id="ondas" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </section>

    </div>

    <!-- ===================== COLUMNA DERECHA ===================== -->
    <div class="columna col-derecha">

      <!-- ACERCA DE MÍ -->
      <section class="panel">
        <p class="panel-titulo">ACERCA DE MÍ <span class="deco"></span></p>
        <p class="panel-texto" id="acerca-texto"></p>
        <button class="btn-ver-mas" id="btn-ver-mas">VER MÁS →</button>
      </section>

      <!-- LENGUAJES DOMINADOS -->
      <section class="panel">
        <p class="panel-titulo">LENGUAJES EN APRENDIZAJE <span class="deco"></span></p>
        <div class="tech-grid" id="lenguajes-contenedor"></div>
      </section>

      <!-- EXPERIENCIA -->
      <section class="panel">
        <p class="panel-titulo">EXPERIENCIA <span class="deco"></span></p>
        <div class="timeline" id="experiencia-contenedor"></div>
      </section>

      <!-- REDES SOCIALES -->
      <section class="panel">
        <p class="panel-titulo">REDES SOCIALES <span class="deco">///</span></p>
        <div class="redes" id="redes-contenedor"></div>
      </section>

    </div>

  </main>

</div>

<div id="youtube-player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>
</body>
</html>
